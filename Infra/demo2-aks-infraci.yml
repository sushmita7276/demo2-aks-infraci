
trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

# Stage 1: Terraform Plan
- stage: Plan
  jobs:
  - job: TerraformPlan
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.13.3'

    - task: AzureCLI@2
      displayName: Terraform Init, Validate and Plan
      inputs:
        azureSubscription: 'demo2-aks-service-connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          cd "$(Build.SourcesDirectory)/Infra"
          echo "Current Terraform directory:"
          pwd
          echo "Terraform configuration files:"
          ls -la 
          find . -name "*.tf" -not -path "./.terraform/*"

          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan
          

    - publish: $(Build.SourcesDirectory)/Infra/tfplan
      artifact: terraform-plan


# Stage 2: Terraform Apply
- stage: Apply
  dependsOn: Plan
  jobs:
  - job: TerraformApply
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.13.3'

    - download: current
      artifact: terraform-plan

    - task: AzureCLI@2
      displayName: Terraform Apply
      inputs:
        azureSubscription: 'demo2-aks-service-connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          cd "$(Build.SourcesDirectory)/Infra"

          terraform init -input=false
          terraform apply -input=false -auto-approve "$(Pipeline.Workspace)/terraform-plan/tfplan"